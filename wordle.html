<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NYT Wordle palette + metrics
   ============================================================ */
:root{
  --green:#6aaa64;
  --yellow:#c9b458;
  --color-tone-1:#1a1a1b;
  --color-tone-2:#787c7e;
  --color-tone-3:#878a8c;
  --color-tone-4:#d3d6da;
  --color-tone-7:#ffffff;
  --key-bg:var(--color-tone-4);
  --key-text-color:var(--color-tone-1);
  --tile-text-color:var(--color-tone-7);
  --header-height:50px;
  --keyboard-height:200px;
  --game-max-width:500px;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:'Libre Franklin','Helvetica Neue',Helvetica,Arial,sans-serif;
  background:var(--color-tone-7);
  color:var(--color-tone-1);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

#game{
  width:100%;
  max-width:var(--game-max-width);
  margin:0 auto;
  height:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ---------- Header ---------- */
header{
  display:flex;
  align-items:center;
  justify-content:center;
  height:var(--header-height);
  flex-shrink:0;
  border-bottom:1px solid var(--color-tone-4);
  position:relative;
}
header .title{
  font-weight:700;
  font-size:36px;
  letter-spacing:.01em;
  text-transform:uppercase;
  line-height:100%;
  pointer-events:none;
}
@media (max-width:360px){ header .title{font-size:22px;} }

/* ---------- Board ---------- */
#board-container{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-grow:1;
  overflow:hidden;
}
#board{
  display:grid;
  grid-template-rows:repeat(6,1fr);
  grid-gap:5px;
  padding:10px;
  box-sizing:border-box;
  width:350px;
  height:420px;
}
.row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-gap:5px;
}
.tile{
  width:100%;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  font-size:2rem;
  line-height:2rem;
  font-weight:700;
  vertical-align:middle;
  text-transform:uppercase;
  user-select:none;
  color:var(--color-tone-1);
  background:var(--color-tone-7);
  border:2px solid var(--color-tone-4);
}
.tile::before{content:'';display:inline-block;padding-bottom:100%;}
.tile[data-state="tbd"]{border-color:var(--color-tone-3);}
.tile[data-state="correct"]{background:var(--green);border-color:var(--green);color:var(--tile-text-color);}
.tile[data-state="present"]{background:var(--yellow);border-color:var(--yellow);color:var(--tile-text-color);}
.tile[data-state="absent"]{background:var(--color-tone-2);border-color:var(--color-tone-2);color:var(--tile-text-color);}

/* ---------- Keyboard ---------- */
#keyboard-container{
  height:var(--keyboard-height);
  flex-shrink:0;
  margin:0 8px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding-bottom:8px;
  user-select:none;
}
.keyboard-row{
  display:flex;
  width:100%;
  margin:0 auto 8px;
  touch-action:manipulation;
}
.keyboard-row:last-child{margin-bottom:0;}
.keyboard-row button{
  font-family:inherit;
  font-weight:700;
  font-size:1.25rem;
  border:0;
  padding:0;
  margin:0 6px 0 0;
  height:58px;
  border-radius:4px;
  cursor:pointer;
  user-select:none;
  background:var(--key-bg);
  color:var(--key-text-color);
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  text-transform:uppercase;
  -webkit-tap-highlight-color:rgba(0,0,0,.3);
  transition:background-color .1s ease, color .1s ease;
}
.keyboard-row button:last-of-type{margin:0;}
.keyboard-row button.wide{flex:1.5;font-size:12px;}
.keyboard-row .spacer{flex:.5;}
button[data-state="correct"]{background:var(--green);color:#fff;}
button[data-state="present"]{background:var(--yellow);color:#fff;}
button[data-state="absent"]{background:var(--color-tone-2);color:#fff;}
button svg{width:20px;height:20px;fill:currentColor;}

/* ---------- Toast ---------- */
#toaster{
  position:absolute;
  top:10%;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  pointer-events:none;
  width:max-content;
}
.toast{
  background:var(--color-tone-1);
  color:var(--color-tone-7);
  padding:16px;
  margin:0 auto 8px;
  border-radius:4px;
  font-weight:700;
  font-size:14px;
  text-align:center;
  animation:SlideIn 120ms;
  transition:opacity 300ms ease-out;
}
.toast.fade{opacity:0;}

/* ---------- Reveal ---------- */
#overlay{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(2px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:900;
  opacity:0;
  visibility:hidden;
  transition:opacity 200ms ease;
}
#overlay.show{opacity:1;visibility:visible;}
.reveal-card{
  position:relative;
  background:var(--color-tone-7);
  border:1px solid var(--color-tone-4);
  border-radius:8px;
  box-shadow:0 4px 23px 0 rgba(0,0,0,.2);
  padding:32px 24px 28px;
  max-width:340px;
  width:100%;
  text-align:center;
  animation:PopUp 200ms cubic-bezier(.2,.9,.3,1.2);
}
.reveal-eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--color-tone-2);
  margin:0 0 14px;
}
.reveal-sentence{
  font-size:20px;
  line-height:1.45;
  font-weight:500;
  margin:0;
}
.reveal-sentence .hl{
  color:var(--green);
  font-weight:700;
}
.close-x{
  position:absolute;
  top:8px;
  right:8px;
  background:none;
  border:0;
  cursor:pointer;
  padding:6px;
  line-height:0;
  color:var(--color-tone-1);
}
.close-x svg{width:20px;height:20px;fill:currentColor;}

/* Sentence panel that takes the keyboard's place once dismissed */
#sentence-panel{
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  height:var(--keyboard-height);
  flex-shrink:0;
  padding:0 24px 16px;
  animation:FadeIn 300ms ease;
}
#sentence-panel.show{display:flex;}
#sentence-panel .reveal-eyebrow{margin-bottom:10px;}
#sentence-panel p.reveal-sentence{font-size:18px;max-width:360px;}

/* ---------- Animations ---------- */
@keyframes PopIn{
  from{transform:scale(.8);opacity:0;}
  40%{transform:scale(1.1);opacity:1;}
  to{transform:scale(1);opacity:1;}
}
.tile.pop{animation:PopIn 100ms linear;}

@keyframes FlipIn{from{transform:rotateX(0);}to{transform:rotateX(-90deg);}}
@keyframes FlipOut{from{transform:rotateX(-90deg);}to{transform:rotateX(0);}}
.tile.flip-in{animation:FlipIn 250ms ease-in;}
.tile.flip-out{animation:FlipOut 250ms ease-in;}

@keyframes Shake{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}
.row.shake{animation:Shake 600ms;}

@keyframes Bounce{
  0%,20%{transform:translateY(0);}
  40%{transform:translateY(-30px);}
  50%{transform:translateY(5px);}
  60%{transform:translateY(-15px);}
  80%{transform:translateY(2px);}
  100%{transform:translateY(0);}
}
.tile.bounce{animation:Bounce 1000ms;}

@keyframes SlideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes PopUp{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes FadeIn{from{opacity:0;}to{opacity:1;}}

@media (prefers-reduced-motion:reduce){
  .tile.pop,.tile.flip-in,.tile.flip-out,.row.shake,.tile.bounce,
  .toast,.reveal-card,#sentence-panel{animation:none !important;}
}

button:focus-visible,.close-x:focus-visible{outline:2px solid var(--color-tone-1);outline-offset:2px;}
</style>
</head>
<body>

<div id="game">
  <header><div class="title">Wordle</div></header>

  <div id="board-container">
    <div id="board" role="group" aria-label="Guess grid"></div>
  </div>

  <div id="keyboard-container">
    <div class="keyboard-row" data-keys="qwertyuiop"></div>
    <div class="keyboard-row" data-keys="asdfghjkl" data-spacers="1"></div>
    <div class="keyboard-row" data-keys="zxcvbnm" data-ends="1"></div>
  </div>

  <div id="sentence-panel">
    <p class="reveal-eyebrow"></p>
    <p class="reveal-sentence"></p>
  </div>

  <div id="toaster" aria-live="polite"></div>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="reveal-text">
    <div class="reveal-card">
      <button class="close-x" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <p class="reveal-eyebrow"></p>
      <p class="reveal-sentence" id="reveal-text"></p>
    </div>
  </div>
</div>

const ROWS = 6, COLS = 5;
const ANSWER = CONFIG.ANSWER.toUpperCase();
const WIN_MESSAGES = ["Genius","Magnificent","Impressive","Splendid","Great","Phew"];

const board = document.getElementById("board");
const toaster = document.getElementById("toaster");
const overlay = document.getElementById("overlay");
const sentencePanel = document.getElementById("sentence-panel");

let current = "";
let rowIndex = 0;
let locked = false;   // true while animating
let over = false;

/* ---------- Dictionary ---------- */
const DICT = new Set();
for (let i = 0; i < WORD_BLOB.length; i += 5) DICT.add(WORD_BLOB.substr(i, 5));
DICT.add(ANSWER.toLowerCase()); // the chosen answer is always valid

/* ---------- Build board ---------- */
const tiles = [];
for (let r = 0; r < ROWS; r++) {
  const row = document.createElement("div");
  row.className = "row";
  const rowTiles = [];
  for (let c = 0; c < COLS; c++) {
    const t = document.createElement("div");
    t.className = "tile";
    t.setAttribute("data-state", "empty");
    row.appendChild(t);
    rowTiles.push(t);
  }
  board.appendChild(row);
  tiles.push(rowTiles);
}
const rowEls = [...board.children];

/* ---------- Build keyboard ---------- */
const BACKSPACE_SVG = '<svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>';

document.querySelectorAll(".keyboard-row").forEach(row => {
  const keys = row.dataset.keys.toUpperCase().split("");
  if (row.dataset.spacers) row.insertAdjacentHTML("beforeend", '<div class="spacer"></div>');
  if (row.dataset.ends) row.insertAdjacentHTML("beforeend", '<button class="wide" data-key="ENTER">Enter</button>');
  keys.forEach(k => {
    const b = document.createElement("button");
    b.dataset.key = k;
    b.textContent = k;
    row.appendChild(b);
  });
  if (row.dataset.spacers) row.insertAdjacentHTML("beforeend", '<div class="spacer"></div>');
  if (row.dataset.ends) row.insertAdjacentHTML("beforeend",
    '<button class="wide" data-key="BACKSPACE" aria-label="Backspace">' + BACKSPACE_SVG + '</button>');
});

document.getElementById("keyboard-container").addEventListener("click", e => {
  const btn = e.target.closest("button[data-key]");
  if (btn) handleKey(btn.dataset.key);
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Enter") return handleKey("ENTER");
  if (e.key === "Backspace") return handleKey("BACKSPACE");
  if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

/* ---------- Input ---------- */
function handleKey(key) {
  if (over || locked) return;
  if (key === "ENTER") return submit();
  if (key === "BACKSPACE") {
    if (!current.length) return;
    current = current.slice(0, -1);
    const t = tiles[rowIndex][current.length];
    t.textContent = "";
    t.setAttribute("data-state", "empty");
    return;
  }
  if (current.length >= COLS) return;
  const t = tiles[rowIndex][current.length];
  t.textContent = key;
  t.setAttribute("data-state", "tbd");
  t.classList.remove("pop");
  void t.offsetWidth;
  t.classList.add("pop");
  current += key;
}

function submit() {
  if (current.length < COLS) {
    shake("Not enough letters");
    return;
  }
  if (CONFIG.VALIDATE_GUESSES && !DICT.has(current.toLowerCase())) {
    shake("Not in word list");
    return;
  }
  reveal(evaluate(current, ANSWER));
}

function shake(msg) {
  toast(msg);
  const row = rowEls[rowIndex];
  row.classList.remove("shake");
  void row.offsetWidth;
  row.classList.add("shake");
}

/* ---------- Evaluation (two-pass, handles repeated letters) ---------- */
function evaluate(guess, answer) {
  const result = new Array(COLS).fill("absent");
  const pool = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === answer[i]) result[i] = "correct";
    else pool[answer[i]] = (pool[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] === "correct") continue;
    if (pool[guess[i]] > 0) { result[i] = "present"; pool[guess[i]]--; }
  }
  return result;
}

/* ---------- Reveal animation ---------- */
function reveal(states) {
  locked = true;
  const rowTiles = tiles[rowIndex];
  const guess = current;

  rowTiles.forEach((t, i) => {
    setTimeout(() => {
      t.classList.add("flip-in");
      setTimeout(() => {
        t.classList.remove("flip-in");
        t.setAttribute("data-state", states[i]);
        t.classList.add("flip-out");
        setTimeout(() => t.classList.remove("flip-out"), 250);
      }, 250);
    }, i * 300);
  });

  const total = (COLS - 1) * 300 + 500;

  setTimeout(() => {
    paintKeyboard(guess, states);
    const won = states.every(s => s === "correct");

    if (won) {
      toast(WIN_MESSAGES[rowIndex]);
      rowTiles.forEach((t, i) =>
        setTimeout(() => t.classList.add("bounce"), i * 100));
      endGame(true, total + 1200);
    } else if (rowIndex === ROWS - 1) {
      toast(ANSWER, 4000);
      endGame(false, 900);
    } else {
      rowIndex++;
      current = "";
      locked = false;
    }
  }, total);
}

function paintKeyboard(guess, states) {
  const rank = { absent: 0, present: 1, correct: 2 };
  for (let i = 0; i < COLS; i++) {
    const btn = document.querySelector('button[data-key="' + guess[i] + '"]');
    if (!btn) continue;
    const prev = btn.getAttribute("data-state");
    if (!prev || rank[states[i]] > rank[prev]) btn.setAttribute("data-state", states[i]);
  }
}

/* ---------- Ending: the sentence ---------- */
function sentenceHTML() {
  if (!CONFIG.HIGHLIGHT_ANSWER) return escapeHTML(CONFIG.SENTENCE);
  const re = new RegExp("\\b(" + ANSWER.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "gi");
  return escapeHTML(CONFIG.SENTENCE).replace(re, '<span class="hl">$1</span>');
}
function escapeHTML(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function endGame(won, delay) {
  over = true;
  const eyebrow = CONFIG.EYEBROW.replace("{word}", ANSWER);
  const html = sentenceHTML();

  document.querySelectorAll(".reveal-eyebrow").forEach(el => el.textContent = eyebrow);
  document.querySelectorAll(".reveal-sentence").forEach(el => el.innerHTML = html);

  setTimeout(() => {
    overlay.classList.add("show");
    overlay.querySelector(".close-x").focus();
  }, delay);
}

overlay.querySelector(".close-x").addEventListener("click", closeReveal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeReveal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && overlay.classList.contains("show")) closeReveal();
});

function closeReveal() {
  overlay.classList.remove("show");
  // The keyboard has done its job — the sentence takes its place.
  document.getElementById("keyboard-container").style.display = "none";
  sentencePanel.classList.add("show");
}

/* ---------- Toast ---------- */
function toast(text, duration = 1000) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  toaster.prepend(el);
  setTimeout(() => {
    el.classList.add("fade");
    el.addEventListener("transitionend", () => el.remove());
  }, duration);
}

/* ---------- Sanity check ---------- */
if (ANSWER.length !== 5 || !/^[A-Z]{5}$/.test(ANSWER)) {
  toast("Setup error: ANSWER must be exactly 5 letters", 999999);
}
</script>
